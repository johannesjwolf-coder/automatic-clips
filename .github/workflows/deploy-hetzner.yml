name: Live Deploy to Hetzner

# Läuft automatisch, sobald die Tests ("ClipControl verification") auf main
# erfolgreich waren. Kann zusätzlich manuell über den Actions-Tab gestartet werden.
on:
  workflow_run:
    workflows: ["ClipControl verification"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-hetzner
  cancel-in-progress: false

env:
  DEPLOY_HOST: jw-clips.com
  DEPLOY_USER: root

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: SSH-Schlüssel einrichten
        env:
          # Secret enthält den privaten Schlüssel Base64-kodiert als eine Zeile
          # (Ausgabe von: base64 -w0 /root/.ssh/github_deploy auf dem Server).
          DEPLOY_SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$DEPLOY_SSH_KEY_B64" | tr -d ' \t\r\n' | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          head -c 40 ~/.ssh/deploy_key | grep -q 'BEGIN OPENSSH PRIVATE KEY' || { echo "Secret DEPLOY_SSH_KEY ist kein gültiger Base64-Schlüssel"; exit 1; }
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deployment auf dem Server ausführen
        run: |
          # Der Schlüssel ist auf dem Server auf scripts/deploy-server.sh eingeschränkt
          # (command="..." in authorized_keys); der Befehl hier ist nur informativ.
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=15 \
            "$DEPLOY_USER@$DEPLOY_HOST" deploy
